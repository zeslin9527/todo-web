<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <!-- viewport-fit=cover so the layout can reach under the notch; padding
       is then added back via env(safe-area-inset-*) in style.css -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="待办">
  <title>待办</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icons/icon-180.png">
  <link rel="icon" type="image/png" href="./icons/icon-180.png">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div id="app">
    <header id="header">
      <div id="title"><span id="date"></span><span id="weekday"></span></div>
      <button id="gearBtn" class="hdrbtn" aria-label="设置">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="butt">
          <!-- cog: dashed thick ring reads as teeth, inner hub -->
          <circle cx="12" cy="12" r="5.8" stroke-width="3.6" stroke-dasharray="3.15 2.5"/>
          <circle cx="12" cy="12" r="2.1" stroke-width="1.5"/>
        </svg>
      </button>
    </header>

    <nav id="segs" aria-label="状态筛选">
      <div id="thumb"></div>
      <button class="seg" data-tab="todo">待办</button>
      <button class="seg" data-tab="completed">已完成</button>
      <button class="seg" data-tab="cancelled">已取消</button>
    </nav>

    <main id="list"></main>

    <div id="splitRow" hidden>
      <span class="spinner"></span><span>正在拆分…</span>
    </div>

    <button id="micBtn" type="button" aria-label="语音输入">
      <svg viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 15.5a3.4 3.4 0 0 0 3.4-3.4V6.4a3.4 3.4 0 1 0-6.8 0v5.7a3.4 3.4 0 0 0 3.4 3.4Z"/>
        <path d="M6 11.4a.8.8 0 0 0-1.6 0A7.6 7.6 0 0 0 11.2 19v1.2H9.4a.8.8 0 0 0 0 1.6h5.2a.8.8 0 0 0 0-1.6h-1.8V19a7.6 7.6 0 0 0 6.8-7.6.8.8 0 0 0-1.6 0 6 6 0 0 1-12 0Z"/>
      </svg>
    </button>

    <footer id="addbar">
      <div id="addField">
        <input id="add" type="text" placeholder="添加待办" enterkeyhint="done" autocomplete="off">
        <button id="addCat" type="button"></button>
        <button id="addGo" type="button" aria-label="添加">
          <svg viewBox="0 0 16 16"><path d="M8 3v10M3 8h10"/></svg>
        </button>
      </div>
    </footer>

    <div id="micCapsule" hidden><span id="micDot"></span>正在聆听… <span id="micInterim"></span></div>

    <div id="backdrop" hidden></div>
    <div id="sheetHost"></div>
    <div id="toast" hidden></div>

    <input type="file" id="importFile" accept="application/json,.json" hidden>
  </div>

  <script src="./lib/core.js"></script>
  <script src="./app.js"></script>
</body>
</html>
